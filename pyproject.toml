[project]
name = "scripture"
version = "0.1.0"
description = "Semi-automated funscript generator from 2D video"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "scipy>=1.11",
    "torch>=2.0",
    "torchvision>=0.15",
    "ultralytics>=8.4",
    "PyQt6",
    "qtawesome",
]

[project.scripts]
scripture = "scripture.main:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-timeout", "vulture"]

[tool.pytest.ini_options]
# A ceiling on a hang, not a performance budget. The slowest test on a
# developer machine is the tracked-tree content scan, but it is not the
# slowest on a runner: it returns early when no blocklist is reachable, and
# the blocklist is git-ignored, so a fresh checkout has none. What CI does run
# longest here is a child interpreter importing the GUI -- cv2, numpy,
# qtawesome and PyQt6 -- at about a second, and four launcher tests that are
# skipped off Windows and so cannot be timed from this machine at all. 120 s
# rather than 60 for that blind spot. --timeout-method=thread is the half that
# pays for itself: it dumps the hung stack, which turns a stalled required
# check into a one-line diagnosis. tests/test_timeouts.py holds all three
# halves of it.
addopts = "--timeout=120 --timeout-method=thread -p app_support.sanitize.pytest_plugin"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["scripture*"]
namespaces = false
