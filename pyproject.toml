[project]
name = "scripture"
version = "0.1.0"
description = "Semi-automated funscript generator from 2D video"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "scipy>=1.11",
    "torch>=2.0",
    "torchvision>=0.15",
    "ultralytics>=8.4",
    "PyQt6",
    "qtawesome",
]

[project.scripts]
scripture = "scripture.main:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-timeout", "vulture"]

[tool.pytest.ini_options]
# The timeout is a ceiling, not a target: the slowest test here is the
# tracked-tree content scan at ~2.8 s, so 60 s clears it twenty times over and
# can only bite on a hang. The thread method prints the hung stack, which is what
# turns a stalled required check into a one-line diagnosis. tests/test_timeouts.py
# holds both halves of it.
addopts = "--timeout=60 --timeout-method=thread"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["scripture*"]
namespaces = false
