[project]
name = "scripture"
version = "0.1.0"
description = "Semi-automated funscript generator from 2D video"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "scipy>=1.11",
    "torch>=2.0",
    "torchvision>=0.15",
    "ultralytics>=8.4",
    "PyQt6",
    "qtawesome",
]

[project.scripts]
scripture = "scripture.main:main"

[project.optional-dependencies]
dev = ["pytest", "vulture"]

[tool.pytest.ini_options]
testpaths = ["tests"]
