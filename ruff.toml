line-length = 100
target-version = "py312"

[lint]
select = ["F", "E", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PL", "PT", "DTZ", "PIE", "PERF", "FLY", "ISC", "RET", "FURB", "EXE"]
ignore = ["E501", "BLE001", "S110",
    # This repo's ratchet: each rule the family config still finds here, and its places today.
    "RUF046",  # 12
    "PLR0913",  # 7
    "PLR0917",  # 5
    "PLR0915",  # 4
    "PLR0912",  # 2
    "B007",  # 1
    "RUF005",  # 1
    "PERF401",  # 1
    "RUF003",  # 1
]
external = ["ARG", "N", "S", "E501", "BLE001", "S110", "RUF046", "PLR0913", "PLR0917", "PLR0915", "PLR0912", "B007", "RUF005", "PERF401", "RUF003"]

[lint.per-file-ignores]
"**/vulture_whitelist.py" = ["B018", "F821"]
"**/tests/**" = ["PLR2004"]
"**/test_*.py" = ["PLR2004"]

[format]
quote-style = "double"
